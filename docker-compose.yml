services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ES_LOCAL_PASSWORD:-changeme}
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ES_LOCAL_PASSWORD:-changeme}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  rag-app:
    image: python:3.12-slim
    container_name: rag-app
    working_dir: /app
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ES_LOCAL_PASSWORD=${ES_LOCAL_PASSWORD:-changeme}
      - ES_LOCAL_API_KEY=${ES_LOCAL_API_KEY}
    command: >
      sh -c "apt-get update && apt-get install -y curl git libgl1 libglib2.0-0 &&
             pip install -r requirements.txt &&
             streamlit run streamlit_chat_app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es_data:
  pip_cache:
